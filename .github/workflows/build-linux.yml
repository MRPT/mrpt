# Updated for MRPT 3.0 (colcon + Codecov)
name: CI Linux

on: [push, pull_request]

# Nothing here writes to the repository: checkout only reads, and Codecov
# uploads with its own token.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}

    env:
      CTEST_OUTPUT_ON_FAILURE: ON
      # Environment for colcon
      COLCON_HOME: ${{ github.workspace }}/.colcon

    strategy:
      fail-fast: false
      matrix:
        name: [ubuntu-latest-clang, ubuntu-latest-gcc]
        build_type: [Release]
        include:
          - name: ubuntu-latest-clang
            os: ubuntu-latest
            compiler: clang
            coverage: OFF

          - name: ubuntu-latest-gcc
            os: ubuntu-latest
            compiler: gcc
            coverage: ON

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Git submodule
        run: |
          git submodule sync
          git submodule update --init --recursive

      - name: Install Dependencies
        run: |
          #sudo apt-mark hold grub-efi-amd64-signed 
          sudo apt-get -y update
          sudo apt-get -y upgrade

          # MRPT Dependencies + Colcon Tooling
          sudo apt install -y cmake build-essential libwxgtk3.2-dev \
                           libeigen3-dev libgtest-dev \
                           freeglut3-dev libglfw3-dev libassimp-dev \
                           libglu1-mesa-dev libqt5opengl5-dev qtbase5-dev \
                           libxrandr-dev libxxf86vm-dev \
                           libftdi-dev libusb-1.0-0-dev libudev-dev libfreenect-dev \
                           libavformat-dev libswscale-dev libpcap-dev \
                           liboctomap-dev libopenni2-dev \
                           libtinyxml2-dev \
                           libdc1394-dev \
                           lcov yamllint \
                           libicu-dev libsimpleini-dev \
                           libcli11-dev \
                           libzstd-dev

          # Virtual X display + Mesa software GL, so that the mrpt_gui window
          # tests can run headlessly (they self-skip without a display):
          sudo apt install -y xvfb libgl1-mesa-dri

          # Added: python3-pip and colcon installation via pip
          sudo apt install -y pybind11-dev python3-dev python3-pip
          pip3 install --break-system-packages colcon-common-extensions colcon-lcov-result numpy

      - name: Colcon Build
        run: |
          colcon build \
            --event-handlers console_direct+ \
            --cmake-args \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DENABLE_COVERAGE=${{ matrix.coverage }} \
              -DCMAKE_VERBOSE_MAKEFILE=ON \
              -DBUILD_TESTING=ON

      - name: Colcon Test
        run: |
          # `xvfb-run` provides the virtual display the mrpt_gui tests need;
          # every other test is unaffected by it.
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            colcon test \
              --event-handlers console_direct+ \
              --return-code-on-test-failure

      - name: Generate Coverage Report
        if: matrix.coverage == 'ON'
        run: |
          # Capture coverage from all sub-folders in build/
          lcov --capture --directory build --output-file coverage.info \
            --ignore-errors mismatch,negative,empty,unused
          # Filter out system headers and third-party code
          lcov --remove coverage.info '/usr/*' '*/build/*' '*/3rdparty/*' '*/3rdparty/*/*' '*/3rdparty/*/*/*' '*/tests/*.cpp' \
            --output-file coverage.info \
            --ignore-errors empty,unused
          lcov --list coverage.info

      - name: Upload to Codecov
        if: matrix.coverage == 'ON'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
